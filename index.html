<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trouble Check List</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#b71c1c"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"></head><body>
<header><div class="langs" id="langs"><button data-l="he">עב</button><button data-l="ru">RU</button><button data-l="en">EN</button></div><h1>Trouble Check List</h1><small data-i="copy"></small></header>
<div id="upd" class="hide" style="background:#1565c0;color:#fff;padding:8px 10px;font-size:14px;text-align:center;cursor:pointer;position:sticky;top:0;z-index:9"><span></span></div>
<main>
<div class="card site"><input id="siteName" data-ph="siteName"><input id="siteAddr" data-ph="siteAddr"></div>
<div class="jobbar"><span id="jobStat"></span><button id="saveJobBtn" data-i="saveJob"></button><button id="newJobBtn" data-i="newJob"></button><button id="doneBtn" class="ok" data-i="doneJob"></button></div>
<div id="roBar" class="robar"><span data-i="roText"></span> <button id="reopenBtn" data-i="reopen"></button></div>
<button class="primary" id="newBtn" data-i="newFault"></button>
<form class="card hide" id="form" style="margin-top:12px">
<label data-i="devType"></label><div class="chips" id="devChips"></div>
<div id="addrBox"><label data-i="addrLbl"></label><div class="row2"><select id="loop"></select><input id="addr" inputmode="numeric" maxlength="3" placeholder="1-127"></div></div>
<div id="zoneBox" class="hide"><label data-i="zoneLbl"></label><select id="zone"></select></div>
<div class="err" id="addrErr"></div>
<label for="loc" data-i="locLbl"></label><input id="loc" data-ph="locPh">
<label for="model" data-i="modelLbl"></label><input id="model" list="models" data-ph="modelPh"><datalist id="models"></datalist>
<label data-i="faultLbl"></label><div class="chips" id="faultChips"></div>
<label for="note" data-i="noteLbl"></label><textarea id="note" data-ph="notePh"></textarea>
<label for="part" data-i="partLbl"></label><input id="part" list="models" data-ph="partPh"><label for="work" data-i="workLbl"></label><textarea id="work" data-ph="workPh"></textarea>
<div class="err" id="formErr"></div>
<div class="row2"><button type="submit" class="ok" id="saveBtn" data-i="save"></button><button type="button" id="cancelBtn" data-i="cancel"></button></div>
</form>
<div class="toolbar" style="margin-top:12px"><button id="shareBtn" data-i="share"></button><button id="clearBtn" data-i="clearAll"></button></div>
<h2 id="hOpen"></h2><div id="list"></div><h2 id="hDone"></h2><div id="done"></div><h2 id="hHist"></h2><input id="hSearch" data-ph="histSearch" style="margin-bottom:4px"><div class="chips" id="hFilter"><button class="chip" data-f="all" data-i="all"></button><button class="chip" data-f="open" data-i="stOpen"></button><button class="chip" data-f="done" data-i="stDone"></button></div><div id="hist"></div>
<footer style="text-align:center;font-size:11px;color:#888;padding:8px">Trouble Check List v<span id="ver">0.2</span></footer></main><div id="toast"></div><script src="models.js"></script><script src="i18n.js"></script><script src="app.js"></script></body></html>
